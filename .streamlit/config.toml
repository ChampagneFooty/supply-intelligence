[theme]
base = "light"
primaryColor = "#8C1C2B"
backgroundColor = "#F6F4F0"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2328"
linkColor = "#8C1C2B"
borderColor = "#E5E1DA"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
redColor = "#8C1C2B"
orangeColor = "#B08D57"
yellowColor = "#B08D57"
greenColor = "#3F6B46"
blueColor = "#46505E"
grayColor = "#9AA0A8"
dataframeBorderColor = "#ECE8E1"
dataframeHeaderBackgroundColor = "#F8F6F2"
chartCategoricalColors = ["#8C1C2B", "#46505E", "#B08D57", "#5F7F63", "#7C8DB5", "#C97B63", "#9B7FB0", "#B7BCC4"]
chartSequentialColors = ["#F7EDEE", "#EBCFD3", "#DCA9B0", "#C97F8A", "#B45565", "#9E3245", "#8C1C2B", "#6E1522", "#520F19", "#360A10"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F4F0"
textColor = "#1F2328"
borderColor = "#ECE8E1"
primaryColor = "#8C1C2B"

[client]
toolbarMode = "minimal"

[server]
enableStaticServing = true
